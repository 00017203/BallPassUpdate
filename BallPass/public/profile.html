<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting – BallPass</title>
</head>
<body>
<script>
  // profile.html is replaced by buyer-dashboard.html and seller-dashboard.html
  fetch("/me").then(r=>r.json()).then(data => {
    if (!data.user) { window.location.href = "landing.html"; return; }
    if (data.user.mode === "seller") {
      window.location.href = "seller-dashboard.html";
    } else {
      window.location.href = "buyer-dashboard.html";
    }
  });
</script>
</body>
</html>
